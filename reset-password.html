```html
<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>

body {
    font-family: Arial;
    max-width:400px;
    margin:60px auto;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    padding:10px 20px;
}

#error {
    color:red;
}

</style>

</head>

<body>

<h2>Reset Password</h2>

<input
type="password"
id="password"
placeholder="New Password">


<input
type="password"
id="confirm"
placeholder="Confirm Password">


<button id="reset">
Reset Password
</button>


<p id="error"></p>


<script>


netlifyIdentity.init();


const params =
new URLSearchParams(
    window.location.hash.substring(1)
);


const recoveryToken =
params.get("recovery_token");


const error =
document.getElementById("error");



document
.getElementById("reset")
.onclick = async function(){


const password =
document.getElementById("password").value;


const confirm =
document.getElementById("confirm").value;



if(password !== confirm){

    error.innerHTML =
    "Passwords do not match";

    return;

}


if(password.length < 8){

    error.innerHTML =
    "Password must be at least 8 characters";

    return;

}



try {


await netlifyIdentity.completeRecovery(
    recoveryToken,
    password
);


alert(
"Password updated successfully"
);


window.location.href="/admin/";


}

catch(err){

console.error(err);

error.innerHTML =
err.message;

}


};


</script>

</body>
</html>
