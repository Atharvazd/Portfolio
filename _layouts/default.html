<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
		<meta name="description" content="{{ page.description | default: site.description }}" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="icon" href="{{ '/images/logo.ico' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
	</head>
	<body class="is-preload">

		{% include header.html %}

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<div id="main">
						{{ content }}
					</div>

				{% include footer.html %}

			</div>

		<!-- Scripts -->
			<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/jquery.scrollex.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/jquery.scrolly.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

		<!-- Netlify Identity: redirect invite/recovery links into the CMS login -->
			<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
			<script>
				if (window.netlifyIdentity) {
					window.netlifyIdentity.on("init", function (user) {
						if (!user) {
							window.netlifyIdentity.on("login", function () {
								document.location.href = "{{ '/admin/' | relative_url }}";
							});
						}
					});
				}
			</script>

	</body>
</html>
