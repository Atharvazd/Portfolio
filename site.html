<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>
</head>
<body>
    <!-- Main heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph -->
    <p>This is my first simple HTML page. HTML is the standard markup language for creating web pages.</p>

    <!-- Link -->
    <p>Visit <a href="https://www.w3schools.com/html/" target="_blank">HTML Tutorial</a> to learn more.</p>

    <!-- Image -->
    <img src="https://via.placeholder.com/300x150" alt="Sample Image" width="300" height="150">

    <!-- List -->
    <h2>My Favorite Things</h2>
    <ul>
        <li>Coding</li>
        <li>Reading</li>
        <li>Traveling</li>
    </ul>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Simple Website</p>
    </footer>
</body>
</html>
