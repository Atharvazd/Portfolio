<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: #222;
            color: white;
            padding: 15px 40px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #00bfff;
        }

        /* Main Content */
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            min-height: 500px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #666;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* Responsive */
        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                text-align: center;
            }

            nav ul {
                margin-top: 15px;
                flex-direction: column;
            }

            nav ul li {
                margin: 10px 0;
            }
        }
    </style>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

<header>
    <div class="navbar">
        <div class="logo">My Blog</div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="posts.html">Posts</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>

    <section class="hero">
        <h1>Welcome to My Blog</h1>

        <p>
            Explore articles, tutorials, thoughts, and ideas on technology,
            programming, and much more.
        </p>
    </section>

</main>

<footer>
    <p>&copy; 2026 My Blog. All Rights Reserved.</p>
</footer>


<script>

if (window.netlifyIdentity) {

    window.netlifyIdentity.init();


    const params =
        new URLSearchParams(
            window.location.hash.substring(1)
        );


    const inviteToken =
        params.get("invite_token");


    const recoveryToken =
        params.get("recovery_token");


    const confirmationToken =
        params.get("confirmation_token");



    /*
       Invite user
    */
    if (inviteToken) {

        window.location.href =
        "/register.html" +
        window.location.hash;

    }



    /*
       Password reset
    */
    else if (recoveryToken) {

        window.location.href =
        "/reset-password.html" +
        window.location.hash;

    }



    /*
       Email confirmation
    */
    else if (confirmationToken) {

        window.netlifyIdentity.on(
            "init",
            function(user){

                window.location.href="/admin/";

            }
        );

    }


}

</script>
</body>
</html>
