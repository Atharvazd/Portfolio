backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"

    folder: "_posts"

    create: true

    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Optional. Shown as the thumbnail on the Posts and All Posts pages. If left blank, a default placeholder image is used." }
      - { label: "Body", name: "body", widget: "markdown" }
