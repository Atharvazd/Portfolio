<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:420px;
    margin:60px auto;
    background:#fff;
    padding:25px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#error{
    color:red;
    margin-top:10px;
}

#inviteForm{
    display:none;
}
</style>

</head>

<body>

<div class="container" id="inviteForm">

<h2>Complete Your Registration</h2>

<p>Create your username and password.</p>

<input
id="username"
type="text"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password">

<button id="createAccount">
Create Account
</button>

<div id="error"></div>

</div>

<script>

const identity = window.netlifyIdentity;

identity.init();

const params = new URLSearchParams(window.location.hash.substring(1));

const inviteToken =
      params.get("invite_token")
   || params.get("confirmation_token");

function loadCMS(){

    const script=document.createElement("script");

    script.src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js";

    document.body.appendChild(script);

}

if(inviteToken){

    document.getElementById("inviteForm").style.display="block";

}else{

    loadCMS();

}

document.getElementById("createAccount").onclick=async function(){

    const username=document.getElementById("username").value.trim();

    const password=document.getElementById("password").value;

    const confirm=document.getElementById("confirmPassword").value;

    const error=document.getElementById("error");

    error.innerHTML="";

    if(username===""){
        error.innerHTML="Please enter a username.";
        return;
    }

    if(password.length<8){
        error.innerHTML="Password must be at least 8 characters.";
        return;
    }

    if(password!==confirm){
        error.innerHTML="Passwords do not match.";
        return;
    }

    try{

        const user=await identity.acceptInvite(
            inviteToken,
            password,
            true
        );

        await user.update({

            data:{
                username:username
            }

        });

        alert("Account created successfully.");

        window.location.href="/admin/";

    }

    catch(err){

        console.error(err);

        error.innerHTML=err.message;

    }

};

identity.on("login",function(user){

    console.log("Logged in",user);

    window.location.href="/admin/";

});

identity.on("logout",function(){

    location.reload();

});

identity.on("error",function(err){

    console.error(err);

});
</script>

</body>
</html>
