<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>

  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
</head>
<body>

<script>
if (window.netlifyIdentity) {

    window.netlifyIdentity.init();

    window.netlifyIdentity.on("init", function(user) {
        console.log("Identity initialized:", user);
    });

    window.netlifyIdentity.on("login", function(user) {
        console.log("Logged in:", user);

        // Close the login modal
        window.netlifyIdentity.close();

        // Reload CMS as authenticated user
        document.location.href = "/admin/";
    });

    window.netlifyIdentity.on("logout", function() {
        document.location.href = "/";
    });

    window.netlifyIdentity.on("error", function(err) {
        console.error("Identity Error:", err);
    });

} else {
    console.error("Netlify Identity Widget failed to load.");
}
</script>

</body>
</html>
